[EMC]
VERSION = 1.1
DEBUG = 0
MACHINE = Edeltraut

[DISPLAY]
DISPLAY = probe_basic
OPEN_FILE = ~/linuxcnc/nc_files/pb_examples/blank.ngc
CONFIG_FILE = custom_config.yml

#POSITION = 0x0
#POSITION_OFFSET = RELATIVE
#POSITION_FEEDBACK = ACTUAL

MAX_FEED_OVERRIDE = 2.000000
MAX_SPINDLE_OVERRIDE = 1.500000
MIN_SPINDLE_OVERRIDE = 0.500000

INTRO_GRAPHIC = pbsplash.png
INTRO_TIME = 5

#PROGRAM_PREFIX = /home/cnc/linuxcnc/nc_files
INCREMENTS = JOG 1mm .1mm .01mm

#DEFAULT_LINEAR_VELOCITY = 150.00000
#MAX_LINEAR_VELOCITY = 150.00000
#MIN_LINEAR_VELOCITY = 0.00000

#DEFAULT_ANGULAR_VELOCITY = 12.000000
#MAX_ANGULAR_VELOCITY = 180.000000
#MIN_ANGULAR_VELOCITY = 1.666667

DEFAULT_SPINDLE_SPEED = 6000

GEOMETRY = xyz
#EDITOR = gedit

#USER_TABS_PATH = user_tabs/
USER_BUTTONS_PATH = user_buttons/
USER_DROS_PATH = user_dro_display/
DRO_DISPLAY = XYZ
OFFSET_COLUMNS = XYZR
TOOL_TABLE_COLUMS = TZDR
#KEYBOARD_JOG = true
#KEYBOARD_JOG_SAFETY_OFF = true

# ATC tab display options, 0 = no atc tab displayed, 1 = Carousel atc display, 2 = rack atc display
ATC_TAB_DISPLAY = 0
#USER_ATC_BUTTONS_PATH = user_atc_buttons/

[HAL]
HALUI = halui
HALFILE = hallib/edeltraut.hal
HALFILE = hallib/mpg.hal
HALFILE = hallib/e-stop.hal
HALFILE = hallib/joints.hal
HALFILE = hallib/spindle.hal
SHUTDOWN = hallib/shutdown.hal
POSTGUI_HALFILE = hallib/custom_postgui.hal
# What is it for? Probe Basic Default
TWOPASS = on


[FILTER]
PROGRAM_EXTENSION = .nc,.txt,.tap Other NC files
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
    png = image-to-gcode
    gif = image-to-gcode
    jpg = image-to-gcode

#PROGRAM_EXTENSION = .py Python Script
#py = python

