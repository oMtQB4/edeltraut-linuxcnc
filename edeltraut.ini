[RS274NGC]
PARAMETER_FILE = linuxcnc.var
RS274NGC_STARTUP_CODE = S6000 G21 G17 G40 G49 G54 G64 P0.04 G80 G90 G91.1 G92.1 G94 G97 G98
OWORD_NARGS = 1
NO_DOWNCASE_OWORD = 1
SUBROUTINE_PATH = macros:subroutines
ON_ABORT_COMMAND = O<on_abort> call

# The remap code
#REMAP=M6  modalgroup=6 prolog=change_prolog ngc=rack_change epilog=change_epilog

[PYTHON]
TOPLEVEL = ./python/toplevel.py
PATH_APPEND = ./python/

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 200000
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010


[HALUI]

[KINS]
JOINTS = 3
KINEMATICS = trivkins coordinates=XYZ

[TRAJ]
AXES = 3
COORDINATES = X Y Z
ANGULAR_UNITS = degree
MAX_ANGULAR_VELOCITY = 360.00
DEFAULT_ANGULAR_VELOCITY = 36.00
LINEAR_UNITS = mm
DEFAULT_LINEAR_VELOCITY = 33.33333
